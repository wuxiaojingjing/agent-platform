# 保险产品查询（场景 4）。AGENT 父卡见 agents/insurance_service.yaml。

- capabilityId: cap.insurance.product.query
  name: 查询保险产品A
  type: TOOL
  granularity: TOOL
  parentCapabilityId: agent.insurance_service
  domains: [insurance_service]
  description: 查询已发布目录中的保险产品A，返回风险等级、参考收益率与保障期限等可比要素。本能力不涉及投保与理赔、不提供保险销售建议
  supportedIntents:
    - 查询保险产品
    - 查看产品A要素
  utterances:
    - 查询产品A
    - 产品A怎么样
    - 看看保险产品A
  keywords: [产品A, 对比, 保险]
  outputSchema:
    type: object
    additionalProperties: false
    required: [productCode, name, domain, riskLevel, returnRate, term]
    properties:
      productCode: {type: string, minLength: 1, maxLength: 64}
      name: {type: string, minLength: 1, maxLength: 128}
      domain: {type: string, const: 保险}
      riskLevel: {type: string, minLength: 1, maxLength: 16}
      returnRate: {type: string, minLength: 1, maxLength: 128}
      term: {type: string, minLength: 1, maxLength: 64}
  requiredSlots: []
  riskLevel: R0
  timeoutMs: 3000
  idempotency: SUPPORTED
  owner: 保险领域
  version: "1.0.0"
  status: ACTIVE
