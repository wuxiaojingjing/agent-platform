# 标准问答库（FP-1I：与小 i 共存）。
#
# 命中即直接念答案，不召回、不调模型、不建任务。所以这里的每一条都相当于一条
# 恒定生效的规则，写宽了就是事故：一条过宽的模版会把大片流量吸进来，
# 而它们本该走能力召回。
#
# 句法模版三个记号，其余字符字面匹配：
#   {甲|乙}  择一，写同义说法
#   [的]     可省，写虚词
#   *        任意若干字，最多 20 字
#
# 匹配的是**整句**，不是片段：片段匹配下「我不想查余额」会命中「查余额」。
# 吃的是用户**原话**，不是改写归一后的检索串。
#
# 与小 i 的关系：同一个标准问在两边的答案必须一致，否则用户换个入口就得到另一套说法。
# 这份库是本侧的口径，对齐工作在运营侧做，工程不代填。
#
# 首批内容来自小 i 逐图复核表，并经小 i 资产映射设计与分阶段消费计划筛选。
# 这里仅维护已批准的窄模板；原始 DSL、损坏记录和迁移状态见 xiaoi/migration-ledger.yaml。

version: xiaoi-batch-1+screenshot-business-directory-1
items:
  - id: qa.transfer.error.26023
    question: 汇款报错：26023
    patterns:
      - "{遇到|出现|提示}26023{怎么办|怎么处理}"
      - "{汇款|转账}{报错|提示}26023"
      - "26023{是什么意思|怎么解决}"
    answer: "通过网银办理跨行汇款时，如遇“26023，系统错误，请联系工行”提示，请不要反复尝试，避免重复提交：先查询账户余额和明细；如果余额减少且明细显示支付成功，说明交易已完成，请关注收款入账。若两者未同时显示，请在24小时后再次查看；余额仍未变化时再重新提交。"
    requiredSlots: []
    actionCapabilityId: cap.account.transaction.query
    actionLabel: 查询账户明细

  - id: qa.card.replacement-care.open
    question: 开通储蓄卡“换卡无忧”方法
    patterns:
      - "{怎么|如何}开通[储蓄卡][的]换卡无忧"
      - "换卡无忧{怎么开通|在哪里开通}"
    answer: "通过营业网点办理卡损换卡、升级换卡、到期换卡或挂失换卡时，均可为储蓄卡开通“换卡无忧”功能；换卡时未开通的，可持新卡在智能终端补开。"
    requiredSlots: []
    actionCapabilityId: cap.card.replace
    actionLabel: 办理换卡

  - id: qa.passbook.account-attribute.adjust
    question: 调整存折账户属性的方法
    patterns:
      - "{怎么|如何}调整存折账户属性"
      - "存折账户{怎么|如何}改成多币种"
      - "调整存折账户属性[的]方法"
    answer: "请携带单币种存折到开户地任意营业网点，申请调整为多币种账户。如开户行未开办外币业务，调整后的多币种账户仍无法办理外币业务。"
    requiredSlots: []

  - id: qa.passbook.close.online-banking
    question: 通过网银将活期存折销户的方法
    patterns:
      - "{怎么|如何}通过网银{注销|销户}活期存折"
      - "网银{能不能|可以}给活期存折销户"
      - "通过网银将活期存折销户[的]方法"
    answer: "如活期存折属于日均存款余额不足300元人民币（含300元）的小额账户，且已开通网银，可登录网上银行，选择“全部-银行卡.账户-小额账户销户”，尝试办理活期存折销户。"
    requiredSlots: []

  - id: qa.card.renumber.impact
    question: 储蓄卡换卡换号受影响的业务
    patterns:
      - "{储蓄卡|借记卡}换卡换号会影响哪些业务"
      - "{储蓄卡|借记卡}换号[后]哪些业务受影响"
      - "了解换卡换号影响"
    answer: "储蓄卡换卡换号后，第三方存管、银证/银期/银商转账、结售汇、跨行代收代付、第三方快捷支付及部分分行特色业务可能受影响，建议换卡时向网点确认迁移手续。代发工资、消费退货、贷款发放和还款、信用卡自动还款、电子银行及部分存款理财协议等，在满足原授权或已开通“换卡无忧”等条件时可迁移至新卡，具体以实际办理结果为准。"
    requiredSlots: []
    actionCapabilityId: cap.card.replace
    actionLabel: 办理换卡

  - id: qa.card.replacement-care.intro
    question: 储蓄卡“换卡无忧”介绍
    patterns:
      - "{什么是|介绍一下}换卡无忧"
      - "换卡无忧{有什么用|是什么功能}"
      - "了解换卡无忧"
    answer: "“换卡无忧”是针对卡片损坏、升级或到期等换卡换号场景提供的特色功能。储蓄卡开通后，换卡时可将部分业务自动迁移到新卡。"
    requiredSlots: []

  # 小 i 原记录的答案为占位符且指令损坏。这里只配置安全引导，不录入或补造业务答案。
  - id: qa.card.same-number.blocked-guidance
    question: 银行卡换卡不换号
    status: BLOCKED_SOURCE_REVIEW
    sourceRef: "xiaoiLedger:reviewed-workbook:standard-question:15"
    patterns:
      - "[银行卡]换卡不换号[怎么办]"
      - "{可以|能不能|能否}原号{补办|换卡}[吗]"
    guidance: "目前无法根据已复核知识确认是否支持原号换卡。您可以先了解相关知识；如继续办理，将进入普通换卡流程，不代表已确认可以保留原号，具体办理条件请以实际页面或网点审核结果为准。"
    options:
      - 了解换卡无忧
      - 了解换卡换号影响
      - 办理普通换卡
    requiredSlots: []

  # 以下条目来自 2026-08-02 手机银行页面截图复核。它们只回答“有哪些功能/属于哪里”，
