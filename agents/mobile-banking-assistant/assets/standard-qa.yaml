    patterns:
      - "手机银行{全部业务|业务分类}{有哪些|有什么}"
      - "手机银行{有哪些|有什么}{业务分类|业务板块}"
      - "手机银行[的]全部业务{分为哪些类|有哪些分类}"
      - "手机银行[都]{有哪些|有什么}{业务|功能}"
    answer: "截图所示手机银行“全部业务”包含账户管理、转账服务、支付管理、财富管理、信用卡、贷款服务、权益服务、生活服务、客户专享、网点服务和金融助手。截图未展示生活服务的下级功能；具体入口与可用范围可能随版本、地区、登录状态和实际页面变化。"
    menuOptions:
      - menu.account.账户管理
      - menu.transfer.转账服务
      - menu.payment.支付管理
      - menu.wealth_aggregate.财富管理
      - menu.creditcard_service.信用卡
      - menu.loan_service.贷款服务
      - menu.benefits_ops.权益服务
      - menu.life_service.生活服务
      - menu.vip_service.客户专享
      - menu.branch_service.网点服务
      - menu.finance_assistant.金融助手
