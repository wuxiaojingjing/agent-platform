# 改写归一用同义词表（v0.7 §2.5.4：改写仅服务检索，不改变面客原文）。
#
# 改写结果只进召回与缓存键，绝不用于回复渲染。把改写后的句子拿去渲染，
# 用户会看到自己没说过的话。

# 口语 -> 归一表述。按 key 长度降序匹配，避免「卡里的钱」被「钱」先替换掉。
replacements:
  卡里还有多少钱: 余额
  卡里有多少钱: 余额
  还有多少钱: 余额
  剩多少钱: 余额
  账上还有多少: 余额
  存款余额: 余额
  应还金额: 账单
  该还多少: 账单
  要还多少: 账单
  转钱: 转账
  打钱: 转账
  汇钱: 转账

# 错别字与变体纠正
corrections:
  余款: 余额
  帐单: 账单
  帐户: 账户
  信用咔: 信用卡

# 停用词，仅在生成缓存键与 BM25 查询时剔除，不影响原文
stopwords: [请, 帮我, 我想, 我要, 麻烦, 一下, 那个, 这个, 呢, 吧, 啊]
