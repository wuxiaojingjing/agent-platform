# 按话题触发的合规提示清单（FP-36 扩展判定，切片计划 §2.7.9 第一处缺口）。
#
# 为什么需要这一份：现有链路上的风险提示全部由能力卡的 riskLevel 触发，而
# 「买什么基金好」「黄金现在能买吗」这类问题**不触发任何 R2 能力**——护栏看不到它，
# 风险提示也不会触发，最后大概率由知识问答直接答了。而投资建议在银行是持牌业务。
# 所以这条通道的触发条件与能力风险等级并列，不看命中哪张卡，只看问的是什么话题。
#
# ⚠️ 本文件当前刻意为空，不是漏填。
# 话题清单与对应话术的口径归业务部与合规（切片计划 §6 阻断项 2b），工程不得自行填一份
# 默认值充数：填了就会在验收表上造出「合规已覆盖」的错觉，而那比空着更坏。
# 空清单的运行期行为与接入本文件之前完全一致——一条提示都不会多出来。
#
# 文件本身必须存在，缺失即拒绝启动。清单为空是一个明确的声明（「口径还没定」），
# 文件不见了则是事故：等业务部填完之后，谁删掉它都只会得到静默不触发。
#
# 填写格式（每项三个字段都必填，缺一即该话题永不触发）：
#
#   topics:
#     - code: INVESTMENT_ADVICE          # 话题码，进指标标签，须是有限集合
#       noticeCode: INVESTMENT_ADVISORY  # 命中后追加到 ResponsePlan.riskNoticeCodes
#       keywords: ["买什么基金", "推荐股票", "值得投吗"]
#
# keywords 按子串包含匹配用户**原话**（不是改写归一后的文本——改写表是为字面检索服务的，
# 合规要看的是用户原本怎么问）。匹配到任一关键词即命中该话题。

