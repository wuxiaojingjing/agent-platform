spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
# Spring E2E tests may rebuild documents with deterministic/no-vector model stubs. Keep their
# index and alias away from the running local stack so a test cannot erase live semantic vectors.
huawei.finance.agent.registry.index-prefix=agent-platform-test-mobile-banking-assistant-capability
huawei.finance.agent.registry.alias=agent-platform-test-mobile-banking-assistant-capability
