global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: agent-platform
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/prometheus-targets.json]
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
