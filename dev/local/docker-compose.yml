  bond-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.bond_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/bond-service:/opt/agent:ro"] }
  branch-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.branch_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/branch-service:/opt/agent:ro"] }
  channel-settings: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.channel_settings }, volumes: ["./.dist:/opt/dist:ro", "../../agents/channel-settings:/opt/agent:ro"] }
