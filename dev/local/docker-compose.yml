x-host-environment: &host-environment
  SERVER_PORT: 8080
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_platform
  SPRING_DATASOURCE_USERNAME: agent_platform
  SPRING_DATASOURCE_PASSWORD: agent_platform
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  HUAWEI_FINANCE_AGENT_NACOS_ENABLED: "true"
  HUAWEI_FINANCE_AGENT_NACOS_SERVER_ADDR: nacos:8848
  HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_GROUP: HUAWEI_FINANCE_AGENT
  A2A_GATEWAY_URL: http://a2a-gateway:8086
  HUAWEI_FINANCE_AGENT_A2A_REMOTE_GATEWAY_URL: http://a2a-gateway:8086
  SERVER_TOMCAT_THREADS_MAX: 16
  SERVER_TOMCAT_THREADS_MIN_SPARE: 1
  MALLOC_ARENA_MAX: 2
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  LOGGING_CONFIG: classpath:logback-spring.xml
  JAVA_TOOL_OPTIONS: -Xms48m -Xmx192m -Xss256k -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2

x-extension-environment: &extension-environment
  <<: *host-environment
  HUAWEI_FINANCE_AGENT_SLOWPATH_EXECUTION_MODE: AUTO_READ_ONLY
  HUAWEI_FINANCE_AGENT_SLOWPATH_MAX_AUTO_STEPS: ${SLOWPATH_MAX_AUTO_STEPS:-5}
  HUAWEI_FINANCE_AGENT_SLOWPATH_ENABLED: ${SLOWPATH_PLANNER_ENABLED:-true}
  HUAWEI_FINANCE_BACKENDS_ACCOUNT_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_TRANSFER_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_CREDITCARD_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_WEALTH_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_FUND_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_INSURANCE_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_DEPOSIT_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_LOAN_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_PAYROLL_BASE_URL: http://banking-systems-simulator:8090
  HUAWEI_FINANCE_BACKENDS_WEALTH_PRODUCT_BASE_URL: http://banking-systems-simulator:8090

x-agent-host: &agent-host
  image: agent-platform/agent-host:0.1.0-SNAPSHOT
  build:
    context: ../..
    dockerfile: dev/local/Dockerfile.host
  entrypoint: ["java", "-jar", "/opt/dist/agent-host-app.jar"]
  restart: "on-failure:3"
  expose: ["8080"]
  mem_limit: 384m
  volumes:
    - "./.dist:/opt/dist:ro"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    nacos: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

x-extension-host: &extension-host
  <<: *agent-host
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    nacos: { condition: service_healthy }
    banking-systems-simulator: { condition: service_healthy }

services:
  banking-systems-simulator:
    image: agent-platform/banking-systems-simulator:0.1.0-SNAPSHOT
    build: { context: ../.., dockerfile: dev/local/Dockerfile.simulator }
    entrypoint: ["java", "-jar", "/opt/dist/banking-systems-simulator.jar"]
    restart: "on-failure:3"
    mem_limit: 192m
    environment:
      JAVA_TOOL_OPTIONS: -Xms24m -Xmx96m -XX:+UseSerialGC
    expose: ["8090"]
    volumes:
      - "./.dist:/opt/dist:ro"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: agent_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["agent-platform-postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["agent-platform-redis-data:/data"]

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: "on-failure:3"
    mem_limit: 1g
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["agent-platform-opensearch-data:/usr/share/opensearch/data"]

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v2.5.1}
    restart: "on-failure:3"
    mem_limit: 768m
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      JVM_MS: 64m
      JVM_MMS: 128m
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes: ["agent-platform-nacos-data:/home/nacos/data"]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    restart: "on-failure:3"
    mem_limit: 128m
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  a2a-gateway:
    image: agent-platform/a2a-gateway:0.1.0-SNAPSHOT
    build: { context: ../.., dockerfile: dev/local/Dockerfile.gateway }
    entrypoint: ["java", "-jar", "/opt/dist/a2a-gateway-app.jar"]
    restart: "on-failure:3"
    mem_limit: 320m
    environment:
      MALLOC_ARENA_MAX: 2
      SERVER_TOMCAT_THREADS_MAX: 16
      SERVER_TOMCAT_THREADS_MIN_SPARE: 1
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx160m -Xss256k -XX:MaxMetaspaceSize=112m -XX:MaxDirectMemorySize=48m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_METRICS_TAGS_AGENT_ID: agent.a2a-gateway
      MANAGEMENT_METRICS_TAGS_IMPLEMENTATION_MODE: gateway
      MANAGEMENT_METRICS_TAGS_ROLE: gateway
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      LOGGING_CONFIG: classpath:logback-spring.xml
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_platform
      SPRING_DATASOURCE_USERNAME: agent_platform
      SPRING_DATASOURCE_PASSWORD: agent_platform
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
      SPRING_FLYWAY_ENABLED: "false"
      AGENT_HOME: /opt/agents/mobile-banking-assistant
    volumes:
      - "../../agents:/opt/agents:ro"
      - "./.dist:/opt/dist:ro"
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mobile-banking-assistant:
    image: agent-platform/mobile-banking-assistant:0.1.0-SNAPSHOT
    build: { context: ../.., dockerfile: dev/local/Dockerfile.mobile }
    entrypoint: ["java", "-jar", "/opt/dist/mobile-banking-assistant.jar"]
    restart: "on-failure:3"
    mem_limit: 768m
    environment:
      MALLOC_ARENA_MAX: 2
      SERVER_TOMCAT_THREADS_MAX: 32
      SERVER_TOMCAT_THREADS_MIN_SPARE: 2
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Xss256k -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=4 -Dio.netty.allocator.numDirectArenas=2
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_METRICS_TAGS_AGENT_ID: agent.mobile-banking-assistant
      MANAGEMENT_METRICS_TAGS_IMPLEMENTATION_MODE: application
      MANAGEMENT_METRICS_TAGS_ROLE: entry
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      LOGGING_CONFIG: classpath:logback-spring.xml
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_HOME: /opt/agents/mobile-banking-assistant
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent_platform
      SPRING_DATASOURCE_USERNAME: agent_platform
      SPRING_DATASOURCE_PASSWORD: agent_platform
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATA_REDIS_HOST: redis
      HUAWEI_FINANCE_AGENT_NACOS_ENABLED: "true"
      HUAWEI_FINANCE_AGENT_NACOS_SERVER_ADDR: nacos:8848
      HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_GROUP: HUAWEI_FINANCE_AGENT
      HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.mobile-banking-assistant
      HUAWEI_FINANCE_AGENT_IMPLEMENTATION_MODE: application
      HUAWEI_FINANCE_AGENT_A2A_DELEGATION_ENABLED: "true"
      HUAWEI_FINANCE_AGENT_SLOWPATH_MAX_AUTO_STEPS: ${SLOWPATH_MAX_AUTO_STEPS:-5}
      HUAWEI_FINANCE_AGENT_INSTANCE_ID: ${MOBILE_BANKING_INSTANCE_ID:-local-mobile-banking-assistant}
      HUAWEI_FINANCE_AGENT_SLOWPATH_ENABLED: ${SLOWPATH_PLANNER_ENABLED:-true}
      HUAWEI_FINANCE_AGENT_LOOP_ENABLED: "true"
      HUAWEI_FINANCE_MOBILE_BANKING_CONSOLE_WRITE_ENABLED: "true"
      A2A_GATEWAY_URL: http://a2a-gateway:8086
      HUAWEI_FINANCE_AGENT_REGISTRY_OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - "../../agents:/opt/agents:ro"
      - "../../tools/promptopt/out:/opt/promptopt-out:ro"
      - "./.dist:/opt/dist:ro"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      nacos: { condition: service_healthy }
      a2a-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  account:
    <<: *extension-host
    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/account, LOADER_PATH: /opt/extension/account.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.account }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  transfer:
    <<: *extension-host
    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/transfer, LOADER_PATH: /opt/extension/transfer.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.transfer }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  creditcard:
    <<: *extension-host
