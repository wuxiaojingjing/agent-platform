    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/finance-assistant, LOADER_PATH: /opt/extension/finance-assistant.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.finance_assistant }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]

  advisory-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.advisory_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/advisory-service:/opt/agent:ro"] }
