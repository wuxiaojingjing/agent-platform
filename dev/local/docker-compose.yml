  security-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.security_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/security-service:/opt/agent:ro"] }
