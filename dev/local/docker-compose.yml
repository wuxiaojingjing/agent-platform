  enterprise-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.enterprise_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/enterprise-service:/opt/agent:ro"] }
  fx-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.fx_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/fx-service:/opt/agent:ro"] }
  life-service: { <<: *agent-host, mem_limit: 256m, environment: { <<: *host-environment, JAVA_TOOL_OPTIONS: "-Xms24m -Xmx96m -Xss256k -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -Dio.netty.eventLoopThreads=2 -Dio.netty.allocator.numDirectArenas=2", AGENT_HOME: /opt/agent, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.life_service }, volumes: ["./.dist:/opt/dist:ro", "../../agents/life-service:/opt/agent:ro"] }
