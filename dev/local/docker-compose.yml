    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  wealth-aggregate:
    <<: *extension-host
    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/wealth-aggregate, LOADER_PATH: /opt/extension/wealth-aggregate.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.wealth_aggregate }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  fund-service:
    <<: *extension-host
    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/fund-service, LOADER_PATH: /opt/extension/fund-service.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.fund_service }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  insurance-service:
