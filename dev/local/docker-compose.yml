  wealth-product: { <<: *extension-host, environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/wealth-product, LOADER_PATH: /opt/extension/wealth-product.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.wealth_product }, volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"] }

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    restart: "on-failure:3"
    mem_limit: 256m
    cpus: 0.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - "./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./.dist/observability/prometheus-targets.json:/etc/prometheus/targets/prometheus-targets.json:ro"
      - "agent-platform-prometheus-data:/prometheus"
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q 'Prometheus Server is Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 20

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    restart: "on-failure:3"
    mem_limit: 320m
    cpus: 0.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - "./observability/loki.yml:/etc/loki/local-config.yaml:ro"
      - "agent-platform-loki-data:/loki"
    ports: ["3100:3100"]

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.10.1}
    restart: "on-failure:3"
    mem_limit: 160m
    cpus: 0.25
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - "./observability/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "agent-platform-alloy-data:/var/lib/alloy"
    depends_on: [loki]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.0}
    restart: "on-failure:3"
    mem_limit: 320m
    cpus: 0.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "agent-platform-grafana-data:/var/lib/grafana"
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, jaeger]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  agent-platform-nacos-data:
  agent-platform-opensearch-data:
  agent-platform-redis-data:
  agent-platform-postgres-data:
  agent-platform-prometheus-data:
  agent-platform-loki-data:
  agent-platform-alloy-data:
  agent-platform-grafana-data:
