    environment: { <<: *extension-environment, AGENT_HOME: /opt/agents/insurance-service, LOADER_PATH: /opt/extension/insurance-service.jar, HUAWEI_FINANCE_AGENT_ASSETS_PATH: /opt/agents/mobile-banking-assistant/assets, HUAWEI_FINANCE_AGENT_NACOS_DISCOVERY_SERVICE_NAME: agent.insurance_service }
    volumes: ["./.dist:/opt/dist:ro", "../../agents:/opt/agents:ro", "./.dist/extensions:/opt/extension:ro"]
  finance-assistant:
